{% extends "base.html" %}
{% block title %}Sign in — Tesla Tracker{% endblock %}
{% block content %}
<div class="login-card">
  <h1>Family sign-in</h1>
  {% if lockout %}
    <p class="flash error">Too many failed attempts. Try again in about {{ lockout }} minute{{ 's' if lockout != 1 }}.</p>
  {% endif %}
  <form method="post">
    <label>Username <input name="username" autofocus required></label>
    <label>Password <input name="password" type="password" required></label>
    <button type="submit">Sign in</button>
  </form>
</div>
{% endblock %}
