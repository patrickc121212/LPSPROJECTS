{% extends "base.html" %}

{% block title %}Books - Biblbot{% endblock %}

{% block content %}
<h1>Books of the Bible (KJV)</h1>
<div class="books-grid">
    {% for book in books %}
    <a href="{{ url_for('book_view', identifier=book.abbrev) }}" class="book-card">
        {{ book.name }}
    </a>
    {% endfor %}
</div>
{% endblock %}
